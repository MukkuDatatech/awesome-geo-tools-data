copyright_year: 2026
name: Awesome GEO Tools
initial_prompt: |-
  A curated directory of Generative engine optimization (GEO): tools that track and improve how brands appear in ChatGPT, Perplexity, Gemini and AI Overviews. Include products such as Profound, Peec AI, Otterly.AI, Scrunch AI, AthenaHQ, Goodie AI, Rankscale, Semrush AI Toolkit, Ahrefs Brand Radar, Writesonic GEO, Evertune, Bluefish, plus other notable commercial and open-source options. Categories: AI Visibility Tracking, Content Optimization for LLMs, Technical GEO & llms.txt, GEO Agencies & Services, AI Traffic Analytics, Open-Source GEO Tools. For every item capture the official website, a short factual description, pricing model (free, freemium, paid, open source), deployment (cloud or self-hosted), key features and integrations.

  Initial categories: AI Visibility Tracking; Content Optimization for LLMs; Technical GEO & llms.txt; GEO Agencies & Services; AI Traffic Analytics; Open-Source GEO Tools.
  Target keywords: generative engine optimization, geo tools, ai visibility, llm seo, answer engine optimization.

  Start with these source lists (use the raw README link for GitHub lists):
  - https://zapier.com/blog/best-ai-visibility-tool/
  - https://raw.githubusercontent.com/amplifying-ai/awesome-generative-engine-optimization/HEAD/readme.md
  - https://raw.githubusercontent.com/luka2chat/awesome-geo/HEAD/README.md
  - https://raw.githubusercontent.com/best-of-ai/awesome-ai-seo/HEAD/README.md
  - https://github.com/topics/generative-engine-optimization

  Inclusion rules: every item is a real product, service, open-source project or platform in scope; never a statistic, quote, blog post, person or general concept.
  One item per product. The item URL is the official website (never an affiliate link, review-site page or "top 10" article). Skip discontinued products and sites that no longer resolve.
  Descriptions: 2-4 factual sentences, no hype; state the pricing model; for open source state the license and link the repository.
  Each item gets exactly one primary category from the initial categories; do not create near-duplicate categories.
  Tags where they apply: Open Source, Self-Hosted, Free Plan, Freemium, Paid, Enterprise, API, AI-Powered, plus niche-specific ones.
  Never use G2, Capterra, GetApp, TrustRadius, AlternativeTo, Product Hunt, SourceForge/Slashdot, There's An AI For That or Toolify as sources.
