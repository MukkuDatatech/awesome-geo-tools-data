markdown: >-
  ## Overview


  OtterlyAI is an AI visibility tracking platform designed for small teams and
  freelancers getting started with generative engine optimization (GEO). It
  monitors how brands appear in AI search engine responses and provides
  actionable recommendations to improve positioning.


  ## Features


  - Daily tracking of LLM prompts across multiple AI search engines

  - GEO and content audits to optimize content for better LLM visibility

  - Turns target SEO keywords into related LLM prompts

  - Tracks Google AI Overviews, ChatGPT, Perplexity, and Microsoft Copilot on
  the base plan

  - Claude, Google AI Mode, and Gemini available as add-ons

  - Crawler traffic analysis available on Standard plan ($189/month) or above

  - Unlimited optimization recommendations available on Standard plan or above


  ## Pricing


  - **Lite plan**: From $29/month — daily tracking of 15 prompts, tracks Google
  AI Overviews, ChatGPT, Perplexity, and Microsoft Copilot

  - **Standard plan**: $189/month — includes crawler traffic analysis and
  unlimited optimization recommendations

  - Free trial available
