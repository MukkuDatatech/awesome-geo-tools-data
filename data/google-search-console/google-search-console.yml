markdown: >-
  ## Overview


  Google Search Console is a free service from Google that helps website owners
  monitor, maintain, and troubleshoot their site's presence in Google Search
  results.


  ## Features


  - Search performance tracking

  - Impressions and clicks data

  - Average position reporting

  - Index coverage reports

  - Mobile usability insights

  - Basic AI insights

  - Sitemap submission


  ## Pricing


  Free.
