markdown: >-
  ## Overview


  auto-geo is an open-source command-line tool that audits web pages for
  AI-citation readiness and measures whether major generative AI search engines
  cite a domain.


  ## Features


  - Open-source CLI for AI-citation readiness auditing

  - Measures citation by ChatGPT, Claude, Gemini, Perplexity, and Grok

  - AI citation readiness assessment

  - Domain-level citation measurement


  ## Pricing


  Free and open source. Repository: https://github.com/shadowresearch/auto-geo


