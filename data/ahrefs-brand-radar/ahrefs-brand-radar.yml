markdown: >-
  ## Overview


  Ahrefs Brand Radar is a focused AI visibility monitoring tool built into the
  Ahrefs SEO platform. It is designed for existing Ahrefs users who want to add
  AI search tracking to their toolkit without switching platforms.


  ## Features


  - Monitors brand performance across major AI platforms

  - Benchmarking against competitors

  - Straightforward, info-packed interface

  - Tracks Google AI Overviews, Google AI Mode, ChatGPT, Perplexity, Gemini, and
  Copilot

  - Integrates with Ahrefs MCP for working with SEO data in AI tools


  ## Pricing


  - Add-on available in addition to existing Ahrefs plan (free or paid)

  - $199/month
