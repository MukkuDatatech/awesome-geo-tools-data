markdown: >-
  ## Overview


  Schema.org is a collaborative community standard for structured data markup on
  web pages, providing a shared vocabulary that helps search engines and AI
  models understand page content.


  ## Features


  - Structured data standards and vocabulary

  - Schema markup definitions for web content

  - Community-driven standard adopted by major search engines

  - AI-readable content markup support


  ## Pricing


  Free and open standard.
