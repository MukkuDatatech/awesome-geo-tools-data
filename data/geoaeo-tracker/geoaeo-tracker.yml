markdown: >-
  ## Overview


  GEO/AEO Tracker is an open-source, local-first AI visibility dashboard for
  tracking brand mentions across AI search platforms.


  ## Features


  - Brand mention tracking across ChatGPT, Perplexity, Gemini, Copilot, Google
  AI Overview, and Grok

  - Visibility scoring

  - Citation analysis

  - Competitor battlecards

  - BYOK (bring your own key)

  - Self-hosted


  ## Pricing


  Free, open-source, self-hosted ($0/month).
