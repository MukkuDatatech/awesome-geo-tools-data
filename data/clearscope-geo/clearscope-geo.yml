markdown: >-
  ## Overview


  Clearscope is a content optimization platform that has extended its
  capabilities into generative engine optimization (GEO). It is designed for
  content creators and SEO teams adapting to the GEO era, connecting content
  creation with AI citation tracking.


  ## Features


  - Content Inventory — tracks pages created with Clearscope and connects them
  to AI Cited Pages view

  - AI Cited Pages — closes the gap between created content and what drives LLM
  visibility results

  - AI Draft — AI content creation tool supporting different brand voices,
  content formats, and outline customization

  - Topic Exploration — topic clustering/fan-out approach beyond primary keyword
  focus

  - Share of voice measurement grounded in SEO best practices

  - LLM tracking limited to ChatGPT, Gemini, and Perplexity

  - Metered custom prompt tracking


  ## Pricing


  - From $129/month for the Essentials plan
