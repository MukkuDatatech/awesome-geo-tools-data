markdown: >-
  ## Overview


  Semrush AI Visibility Toolkit is an add-on for existing Semrush users that
  combines AI visibility tracking with Semrush's trusted SEO platform. It allows
  users to manage SEO data and AI search tracking in one place, with
  actionability to move directly into content optimization, backlink analysis,
  site audits, and competitive research.


  ## Features


  - Tracks brand mentions, prompts, citations, sentiment, and competitor
  visibility across major AI platforms

  - Extensive prompt database: 317+ million prompts

  - Tracks ChatGPT, Google AI, Gemini, and Perplexity

  - Integrates with Semrush SEO tools (content optimization, backlink analysis,
  site audits, competitive research)

  - Semrush integration with Zapier — connect with 10,000+ apps for workflow
  automation


  ## Pricing


  - Available as an add-on for existing Semrush users

  - Starting at $99/month per domain/sub-user

  - Charges based on number of users
