markdown: >-
  ## Overview


  Geodaddy llms.txt Playground is a free web-based generator that crawls a
  target site's URLs and emits a markdown llms.txt file optimized for large
  language model crawlers.


  ## Key Features


  - Crawls website URLs to build an index

  - Generates spec-compliant llms.txt markdown

  - Output readable by ChatGPT, Claude, and Perplexity

  - No signup required

  - No API key required


  ## Pricing Model


  Free.


  ## Deployment


  Cloud-hosted web tool.
