markdown: >-
  ## Overview


  Yext Scout is an AI visibility platform designed for enterprises with multiple
  locations. Unlike national-level AI visibility trackers, Scout breaks down AI
  brand monitoring by individual location, showing how each branch appears in AI
  search results.


  ## Features


  - AI visibility by individual brand location

  - Map showing visibility per location based on engine data from ChatGPT,
  Gemini, Claude, and Perplexity

  - Tracks performance against 20 closest competitors per scan based on location
  and trends

  - Sentiment analysis — identifies recurring themes in AI outputs related to
  your brand

  - Citation tracking — shows which sources AI answers use

  - Agents that perform actions across Yext's marketing tools (requires the full
  Yext platform)

  - Connects to a broader suite of brand visibility tools


  ## Pricing


  - By request

  - Third-party pricing info suggests at least $199/month

  - Designed for enterprises with hundreds to thousands of locations
