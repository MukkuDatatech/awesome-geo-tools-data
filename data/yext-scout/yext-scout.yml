name: Yext Scout
description: A local AI visibility tracking platform that monitors brand
  appearance in AI search engines by individual business location. It provides a
  map-based visibility view across locations, tracks competitors per location,
  performs sentiment analysis on AI outputs, and offers citation tracking.
  Agents can be sent to perform actions across Yext's marketing tools. Pricing
  is by request, with third-party info suggesting at least $199/month.
