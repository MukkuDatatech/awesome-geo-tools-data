name: LLMrefs
description: LLMrefs is an AI search visibility tracker for keyword-level
  monitoring. You import the keywords you want to own, and the platform
  automatically generates fan-out prompts based on real AI conversations, then
  runs those across major answer engines to calculate brand rankings, share of
  voice, average position, and citation counts for each keyword. It also lets
  you inspect the source URLs cited in responses, filter performance by engine
  or country, and export the data in CSV or via the API. It includes
  weekly-renewed reporting, monthly prompt volume estimates, geo-targeting
  across 50+ countries and 20+ languages, unlimited projects, and
  agency-oriented workspace features. The tradeoff is that it remains a
  visibility and citation analytics platform, not an attribution product; it
  doesn't connect that visibility to on-site conversion or revenue outcomes.
  Pricing is paid.
