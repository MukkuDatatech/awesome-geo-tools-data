markdown: >-
  ## Overview


  LLMrefs is an AI search visibility tracker for keyword-level monitoring. You
  import the keywords you want to own, and the platform automatically generates
  fan-out prompts based on real AI conversations, then runs those across major
  answer engines.


  ## Key Features


  - Keyword-level AI visibility tracking

  - Automatically generates fan-out prompts based on real AI conversations

  - Runs prompts across major answer engines

  - Calculates brand rankings, share of voice, average position, and citation
  counts per keyword

  - Inspect source URLs cited in responses

  - Filter performance by engine or country

  - Export data in CSV or via API

  - Weekly-renewed reporting

  - Monthly prompt volume estimates

  - Geo-targeting across 50+ countries and 20+ languages

  - Unlimited projects

  - Agency-oriented workspace features


  ## Limitations


  - Visibility and citation analytics platform, not an attribution product

  - Does not connect visibility to on-site conversion or revenue outcomes


  ## Best For


  Teams that want keyword-based AI visibility tracking with citation and
  competitor data across multiple answer engines.


  ## Pricing Model


  Paid.


  ## Deployment


  Cloud


  ## Integrations


  API available for data export.
